name: Check SkillLoop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and local links
        run: python3 scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check knowledge backend contracts
        run: node --test api/knowledge.test.mjs
